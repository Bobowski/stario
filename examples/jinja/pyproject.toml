[project]
name = "stario-jinja-example"
version = "0.0.0"
description = "Shared counter with Jinja templates and live SSE updates (main:bootstrap)"
requires-python = ">=3.14"
dependencies = [
    "stario>=4,<5",
    "jinja2>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
