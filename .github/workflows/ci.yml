name: CI

on:
  push:
    branches: [main, cython-core]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libnghttp2-dev libbrotli-dev nghttp2-client
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright
      - run: uv run pytest
