name: CI

on:
  push:
    branches: [main, cython-core]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 3.14t is the free-threaded build: the cp314t wheel and
        # STARIO_THREADS>1 are only real if the suite runs with the GIL off.
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
    runs-on: ubuntu-latest
    env:
      # Ubuntu's 1.59 is new enough to test against; release wheels bundle 1.70.
      STARIO_ALLOW_OLD_NGHTTP2: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libnghttp2-dev libbrotli-dev libzstd-dev nghttp2-client
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - name: GIL is off on the free-threaded build
        if: matrix.python-version == '3.14t'
        run: |
          uv run python -c "import sys, stario_cython.exchange, stario_cython.protocol; assert not sys._is_gil_enabled(), 'an extension re-enabled the GIL'"
      - run: uv run ruff check src tests setup.py
      - run: uv run ruff format --check src tests setup.py
      - run: uv run pyright
      - run: uv run pytest
